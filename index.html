<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecoe — puzzle logique</title>
<style>
  :root { --bg: #F6F4EF; --text: #1E1F24; --muted: #5E5F66; --accent: #23A69E; --link: #14786F; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15161A; --text: #ECEDEF; --muted: #A3A5AD; --accent: #2BB8AF; --link: #4FD1C7; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 16px; text-align: center; }
  .logo { width: 96px; height: 96px; border-radius: 26px; }
  h1 { font-size: 44px; margin: 16px 0 4px; }
  p { color: var(--muted); }
  a { color: var(--link); font-weight: 700; }
  .links { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="icon_512.png" alt="Logo Ecoe">
  <h1>Ecoe</h1>
  <p>Colorie les cases pour satisfaire les flèches. Jamais deux cases pleines côte à côte.<br>
     Fill cells to satisfy the arrows. Never two filled cells side by side.</p>
  <div class="links">
    <a href="https://play.google.com/store/apps/details?id=com.lemnastudio.ecoe">Google Play</a>
    <a href="privacy.html">Confidentialité / Privacy</a>
  </div>
</main>
</body>
</html>
